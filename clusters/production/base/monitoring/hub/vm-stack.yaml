apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-stack
  namespace: flux-system
spec:
  interval: 5m
  releaseName: vm-stack
  targetNamespace: monitoring
  # The post-install/upgrade sync-job hook downloads the dashboards from GitHub.
  timeout: 10m

  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.95.2"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  # Keep the VictoriaMetrics operator CRDs in sync with the chart on upgrades (Flux skips CRD updates by default).
  install:
    createNamespace: false
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
