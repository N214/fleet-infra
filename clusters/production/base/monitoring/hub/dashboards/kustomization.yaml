apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Extra Grafana dashboards, one ConfigMap per JSON file (same pattern as the old apps/monitoring Helm helper).
# The Grafana sidecar loads ConfigMaps labeled grafana_dashboard=1 and puts each one in the folder named by its
# grafana_folder annotation (enabled in vm-stack-patch.yaml). Files are copies with the datasource normalized:
# datasource variables have no saved `current` (Grafana picks the default) and legacy "prometheus" string
# datasources point at uid VictoriaMetrics. The Kubernetes / Views dashboards come from the vm-stack chart instead.
namespace: monitoring
configMapGenerator:
  - name: grafana-dashboard-api-server
    files: [kubernetes/api-server.json]
    options: &kubernetes
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Kubernetes
  - name: grafana-dashboard-coredns
    files: [kubernetes/coredns.json]
    options: *kubernetes
  - name: grafana-dashboard-cilium-agent
    files: [cilium/cilium-agent.json]
    options: &cilium
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Cilium
  - name: grafana-dashboard-cilium-operator
    files: [cilium/cilium-operator.json]
    options: *cilium
  - name: grafana-dashboard-hubble
    files: [cilium/hubble.json]
    options: *cilium
  - name: grafana-dashboard-hubble-l7-http
    files: [cilium/hubble-l7-http.json]
    options: *cilium
