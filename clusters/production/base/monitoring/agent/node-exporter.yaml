apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: flux-system
spec:
  interval: 5m
  releaseName: node-exporter
  targetNamespace: monitoring

  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.59.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: false
  values:
    fullnameOverride: node-exporter
    service:
      # Listen on the node IP only (host network), not on every interface such as tailscale0.
      listenOnAllInterfaces: false
    # Same exclusions as the victoria-metrics-k8s-stack defaults.
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
