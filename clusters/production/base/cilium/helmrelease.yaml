apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: kube-system

  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      version: "1.19.2" 
  install:
    targetNamespace: kube-system
    createNamespace: false
  values:
    cilium:
      enabled: true
      k8sServiceHost: "127.0.0.1"
      k8sServicePort: "6443"
      egressGateway:
        enabled: true
      cluster:
        name: cilium
      autoDirectNodeRoutes: true
      bpf:
        masquerade: true
      envoyConfig:
        enabled: true
      gatewayAPI:
        enabled: true
        externalTrafficPolicy: Local
      hubble:
        enableOpenMetrics: true
        metrics:
          enabled:
            - 'dns:query;ignore_metrics=dns'
            - drop:sourceContext=identity;destinationContext=identity
            - tcp
            - flow
            - "port-distribution"
            - icmp
            - 'httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction;sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity'
          serviceMonitor:
            enabled: true
        relay:
          enabled: true
        ui:
          enabled: true
        dashboards:
          enabled: true
          namespace: monitoring
          annotations:
            grafana_folder: "monitoring"
      ipam:
        operator:
          clusterPoolIPv4PodCIDRList: ["10.0.0.0/16"]
      kubeProxyReplacement: "true"
      ipv4NativeRoutingCIDR: "10.0.0.0/16"
      loadBalancer:
        mode: dsr
        l7:
          backend: envoy
      envoy:
        enabled: true
      routingMode: "native"
      operator:
        prometheus:
          enabled: true
        replicas: 1
      nodeinit:
        enabled: true
      clustermesh:
        useAPIServer: true
        apiserver:
          tls:
            authMode: "legacy"
          etcd:
            enabled: true
          kvstoremesh:
            enabled: true
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
        config:
          enabled: false
          domain: mesh.cilium.io
    prometheus:
      enabled: false
      serviceMonitor:
        enabled: true
