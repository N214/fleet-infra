---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-flux
spec:
  endpointSelector: {}  # selects all pods in this namespace
  ingress:
  - toEntities:
    - cluster
    - world
    - host
  egress:
  - toEntities:
    - cluster
    - world
    - host
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fluxcd
spec:
  parentRefs:
  - name: gateway
    namespace: kube-system
  hostnames:
  - "fluxcd.ntcloud.dev"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: flux-operator 
      port: 9080
