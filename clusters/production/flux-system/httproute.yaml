apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fluxcd
spec:
  parentRefs:
  - name: gateway
    namespace: kube-system
  hostnames:
  - "fluxcd.ntcloud.dev"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: flux-operator 
      port: 8080
