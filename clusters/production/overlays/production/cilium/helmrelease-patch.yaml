apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  values:
    k8sServiceHost: "127.0.0.1"
    k8sServicePort: "6443"
    egressGateway:
      enabled: true
    cluster:
      name: cilium
      id: 1
    autoDirectNodeRoutes: true
    bpf:
      masquerade: true
      hostLegacyRouting: true
    envoyConfig:
      enabled: true
    gatewayAPI:
      enabled: true
      hostNetwork:
        enabled: false
    hubble:
      ui:
        enabled: true
      relay:
        enabled: true
        affinity: {}
      enableOpenMetrics: true
      metrics:
        enabled:
          - "dns:query;ignore_metrics=dns"
          - drop:sourceContext=identity;destinationContext=identity
          - tcp
          - flow
          - "port-distribution"
          - icmp
          # No source_ip/destination_ip: per-IP labels make one series per client address.
          - "httpV2:exemplars=true;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction;sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity"
        serviceMonitor:
          enabled: false
        # Hubble dashboards as ConfigMaps for the Grafana sidecar (monitoring namespace, Cilium folder).
        dashboards:
          enabled: true
          namespace: monitoring
          annotations:
            grafana_folder: Cilium
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList: ["10.0.0.0/16"]
    kubeProxyReplacement: "true"
    socketLB:
      hostNamespaceOnly: true
    ipv4NativeRoutingCIDR: "10.0.0.0/16"
    loadBalancer:
      mode: dsr
      l7:
        backend: envoy
    envoy:
      enabled: true
      useOriginalSourceAddress: false
      securityContext:
        capabilities:
          keepCapNetBindService: true
          envoy:
            - NET_ADMIN
            - SYS_ADMIN
            - NET_BIND_SERVICE
    routingMode: "native"
    operator:
      prometheus:
        enabled: true
      dashboards:
        enabled: true
        namespace: monitoring
        annotations:
          grafana_folder: Cilium
      replicas: 1
    nodeinit:
      enabled: true
    clustermesh:
      useAPIServer: true
      apiserver:
        tls:
          authMode: "legacy"
        etcd:
          enabled: true
        kvstoremesh:
          enabled: true
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
      config:
        enabled: false
        domain: mesh.cilium.io
    # Agent metrics on :9962, scraped by the OTel collector (base/monitoring/agent/otel.yaml). No ServiceMonitor:
    # nothing here runs Prometheus or vmagent, and one would double-scrape if vmagent is added later.
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: false
    dashboards:
      enabled: true
      namespace: monitoring
      annotations:
        grafana_folder: Cilium
