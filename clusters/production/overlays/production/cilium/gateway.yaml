apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: public-ip-pool
spec:
  blocks:
  - cidr: 129.153.58.143/32
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "hubble-dns-visibility-safe"
spec:
  endpointSelector: {} # Selects all pods in the namespace
  egress:
    # 1. Enable DNS Visibility (Metrics)
    - toPorts:
      - ports:
        - port: "53"
          protocol: UDP
        rules:
          dns:
            - matchPattern: "*"
    # 2. Re-allow all other traffic (Prevents breaking your HTTPRoute)
    - toEntities:
      - cluster
      - world
      - host
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cloudflare-cert
spec:
  secretName: cloudflare-cert
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer
  dnsNames:
    - "*.ntcloud.dev"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
        - kind: Secret
          name: cloudflare-cert
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
spec:
  parentRefs:
  - name: gateway
    namespace: kube-system
  hostnames:
  - "hubble.ntcloud.dev"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: hubble-ui
      port: 80
