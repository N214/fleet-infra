apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel
  namespace: flux-system
spec:
  # The VMUser credentials Secret and vmauth come from the hub release (this cluster only).
  dependsOn:
    - name: vm-stack
  values:
    extraEnvs:
      # In-cluster vmauth. Other clusters use https://metrics.ntcloud.dev/opentelemetry/v1/metrics.
      - name: VM_INGEST_URL
        value: http://vmauth-vm-stack.monitoring.svc:8427/opentelemetry/v1/metrics
      # Generated by the VictoriaMetrics operator for VMUser "production" (see vm-stack-patch.yaml extraObjects).
      - name: VM_INGEST_USERNAME
        valueFrom:
          secretKeyRef:
            name: vmuser-production
            key: username
      - name: VM_INGEST_PASSWORD
        valueFrom:
          secretKeyRef:
            name: vmuser-production
            key: password
    # Hub-only scrape job (merged into the base config): VictoriaMetrics' own metrics for its dashboard.
    alternateConfig:
      receivers:
        prometheus/hub:
          config:
            scrape_configs:
              - job_name: victoria-metrics
                scrape_interval: 30s
                static_configs:
                  - targets: ["vmsingle-vm-stack.monitoring.svc:8428"]
      service:
        pipelines:
          metrics/hub:
            receivers: [prometheus/hub]
            processors: [memory_limiter, transform/prometheus, batch]
            exporters: [otlp_http/victoriametrics]
