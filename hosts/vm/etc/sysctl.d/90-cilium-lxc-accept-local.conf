# Cilium L7 proxy (Gateway API) + Tailscale on the same host:
# tailscaled sets net.ipv4.conf.all.src_valid_mark=1, which makes the kernel drop
# Cilium proxy traffic (fwmark 0x200 -> table 2004) with IP_LOCAL_SOURCE.
# Allow it on Cilium pod veths only. https://github.com/cilium/cilium/issues/48706
net.ipv4.conf.lxc*.accept_local = 1
